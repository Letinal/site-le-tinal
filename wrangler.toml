# Cloudflare Workers (static assets) — site Le Tinal
name = "le-tinal"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist/_worker.js/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"

# Stockage partage du planning des benevoles
[[kv_namespaces]]
binding = "BENEVOLES"
id = "3ace5fd38e934eebac749e85bd2cbe9d"
